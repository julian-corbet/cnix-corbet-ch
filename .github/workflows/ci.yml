name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # The whole verification runs in well under a minute; this leaves ample headroom for a
    # cold npm cache while still killing a wedged run long before the six-hour default.
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        id: deps
        run: npm ci
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - name: Remove ephemeral scanner report
        run: rm -- results.sarif
      # `npm run check` chains lint && test && build behind `&&`, so the first failure
      # hid the verdicts of the other two. These are the same three scripts in the same
      # order, one step each, so every run reports all three. Gated on the install only
      # -- node_modules is their one real dependency; a failed lint must not skip them.
      - name: Lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint
      - name: Test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm test
      - name: Build site
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build
      - name: Preserve reviewed website artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cnix-public-site
          path: public
          if-no-files-found: error
          retention-days: 14
